<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>
    <div class="main-content wrapper">
        <div class="main-content one">
            <header>
                <div class="logo-container">
                    <img src="./assets/thenocompany_logo.png" alt="logo pic">
                </div>
                <div class="top-buttons">
                    <button>Camping</button>
                    <button>Pricing</button>
                    <button>Services</button>
                    <button>Contact</button>
                </div>
                <div class="right-button-container">
                    <button class="right-button">Get Started</button>
                </div>
            </header>

            <main>
                <div class="hero-section">
                    <p class="hero-text">Escape the Ordinary<br>Camp under the stars</p>
                    <p class="hero-description">Discover curated camping experiences in breathtaking locations
                        <br>tents, cabins, bonfires, and all the adventures you crave.
                    </p>
                </div>
                <button class="hero-get-started-button bottom">Get Started</button>
                <button class="know-more-button bottom">Know More</button>
            </main>
            <footer>
                <div class="footer-container">
                    <div class="footer-image-container">
                        <img src="./assets/profPic2.png" alt="" class="prof">
                        <img src="./assets/profPic3.png" alt="" class="prof">
                        <img src="./assets/profPic1.png" alt="" class="prof">
                    </div>
                    <div class="footer-text">
                        500+ happy<br> customers
                    </div>
                </div>
            </footer>
        </div>
    </div>
</body>
</html>
